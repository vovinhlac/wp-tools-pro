name: Feature request
description: Propose a focused WordPress/PHP improvement
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the user, operational, performance, or maintenance problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Explain the smallest useful solution and important trade-offs.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ...\n- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and compatibility
      description: Note security, migration, performance, privacy, or backward-compatibility concerns.
